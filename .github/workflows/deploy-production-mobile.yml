name: Deploy production build (mobile)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"

concurrency:
  group: deploy-production-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check mobile
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Test mobile
        working-directory: apps/mobile
        run: npx jest --ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production (Android)
        working-directory: apps/mobile
        run: eas build --profile production --platform android --non-interactive
