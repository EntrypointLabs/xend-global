name: SDK Release

# Publishes @xend/checkout-core and @xend/checkout-react. Opens a version PR
# while changesets are pending, and publishes when that PR merges. Runs only
# on main; never from a PR branch.
#
# NPM_TOKEN is an npm automation token provisioned by a human as a repo secret
# (see ADR 0018). The FIRST real publish is additionally gated on the phase
# interop hard gate and npm org ownership confirmation; do not remove that gate.
on:
  push:
    branches: [main]

concurrency: sdk-release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
