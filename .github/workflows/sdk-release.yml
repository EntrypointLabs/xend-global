name: SDK Release

# Publishes @prydd/checkout-core and @prydd/checkout-react. Opens a version PR
# while changesets are pending, and publishes when that PR merges. Runs only
# on main; never from a PR branch.
#
# Publishing authenticates through npm trusted publishing (GitHub OIDC), so
# there is no npm token in the repo. Each package has a trusted publisher on
# npmjs.com bound to this workflow file; renaming the file breaks publishing
# until those entries are updated. npm attaches provenance automatically.
on:
  push:
    branches: [main]

concurrency: sdk-release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
