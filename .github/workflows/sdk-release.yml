name: SDK Release

# Publishes @prydd/checkout-core and @prydd/checkout-react. Opens a version PR
# while changesets are pending, and publishes when that PR merges. Runs only
# on main; never from a PR branch.
#
# Node 24 ships npm 11, which publishes through npm trusted publishing (OIDC)
# when a trusted publisher is configured for the package, and falls back to
# NPM_TOKEN otherwise. Both paths attach provenance.
on:
  push:
    branches: [main]

concurrency: sdk-release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
