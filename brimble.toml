# The backend Dockerfile builds from the repo root: it copies workspace
# packages alongside apps/backend, so the root directory stays the repo root.
# Brimble only accepts a Dockerfile at the root, so backend.Dockerfile links
# to apps/backend/Dockerfile.
[services.api]
type = "web"
region = "eu-central"

[services.api.build]
dockerfile = "backend.Dockerfile"
watch = [
  "apps/backend/**",
  "packages/smart-account/**",
  "packages/typescript-config/**",
  "package.json",
  "package-lock.json",
]

[services.api.deploy]
before_start = "npx drizzle-kit migrate"
port = 8000
health = "/health"

# Test deployment on devnet. KAFKA_BROKERS is unset on purpose: no broker
# until Pay with Prydd launches.
[services.api.env]
NODE_ENV = "production"
SOLANA_CLUSTER = "devnet"
EXPO_PUBLIC_USDC_MINT_ADDRESS = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
DATABASE_URL = "{{@prydd-pg.PRIVATE_CONNECTION_STRING}}"
REDIS_URL = "{{@prydd-redis.PRIVATE_CONNECTION_STRING}}"

[services.api.secrets]
required = [
  "PRIVY_APP_ID",
  "PRIVY_APP_SECRET",
  "HELIUS_API_KEY",
  "HELIUS_RPC_URL",
  "HELIUS_WEBHOOK_SECRET",
  "SETTLEMENT_AUTHORITY_SECRET_KEY",
  "INTERNAL_API_SECRET",
  "CHECKOUT_RETURN_URL_SECRET",
]

[databases.prydd-pg]
engine = "postgresql"
version = "17"
region = "eu-central"
cpu = 0.5
memory = "1gb"
public = false
disk = "10gb"

[databases.prydd-redis]
engine = "redis"
version = "7"
region = "eu-central"
cpu = 0.5
memory = "1gb"
public = false
disk = "10gb"
